[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The code imports bm25s; [core] keeps its fast backend without the
    # wrapper package's CLI extras (rich, ...).
    "bm25s[core]>=0.3.9",
    "faiss-cpu>=1.14.3",
    "langchain>=1.3.11",
    # Every model is reached over the AI Gateway's OpenAI-compatible API —
    # Anthropic- and Google-served ones included — so llm_client imports
    # ChatOpenAI unconditionally. Core, not an extra.
    "langchain-openai>=1.3",
    "langgraph>=1.0",
    "markdown-it-py>=3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.0",
    "sqlglot>=25",
    # llm_client.tokens and memory.turns count tokens with it directly (it
    # already arrives via langchain-openai; declared so that stays true).
    "tiktoken>=0.7",
]

[project.scripts]
# main.py is the entry point: SharePoint-driven by default, local with a
# positional source directory.
sas-parser = "main:main"
# V2 composition shell. Operational subcommands are added only as their use
# cases move behind v2 application ports.
sas-migrate = "sas_migrate.cli:main"

[project.optional-dependencies]
# Delta memory backend + validation tracking (Spark/JVM). The default
# in-memory mode must import and run without pyspark (Architecture.md
# invariant 8), so it is an extra, not a core dependency.
#
# Upper bound is Delta Lake's, not ours. Published Delta releases on this line
# declare support through PySpark 4.1.1. Delta 4.1.0's metadata omits that upper
# bound, so a resolver accepts 4.1.2/4.1.3 even though the Python DeltaTable API
# and ALTER TABLE property path then fail on the removed Catalyst
# ``IgnoreCachedData`` class. Keep the runtime on the compatible 4.1.0/4.1.1
# patch line until a Delta release explicitly supports a newer Spark runtime.
# The Docker build and direct DeltaTable contracts verify the pairing for real.
spark      = ["pyspark>=4.1,<4.1.2"]
vault      = ["hvac>=2.0"]
azure      = ["msal>=1.28"]
databricks = ["databricks-sdk>=0.30", "databricks-sql-connector>=3.0"]
# Optional Databricks Model Serving adapters used by memory.databricks_ai.
# It is intentionally separate from the workspace/SQL SDK extra and never a
# core dependency: plain memory, tests, and local development remain offline.
databricks-ai = ["databricks-langchain>=0.15"]
# SharePoint over Microsoft Graph. msal comes along because auth is delegated to
# app_config.azure (which mints the Graph token); msgraph-sdk pulls in
# azure-identity, the kiota runtime, and httpx itself.
sharepoint = ["msgraph-sdk>=1.5", "msal>=1.28"]
# nbformat is a *test* dependency only: pipeline.notebook writes the v4.5 JSON
# itself (the schema is small and stable, and the runtime should not grow a
# jupyter dependency to emit JSON), and tests/test_notebook.py validates what
# it emits against the real published schema.
dev        = ["pytest>=8", "pytest-cov", "ruff", "nbformat>=5.10", "matplotlib>=3.8"]
# Draws complexity's corpus dependency graph as a PNG beside the Markdown
# report. Optional: complexity.graph always renders the same edges as a
# Markdown table, and render_png returns None (with a log line) when matplotlib
# is absent — the picture is a supplement, never the only copy.
graph      = ["matplotlib>=3.8"]
# data_hydration's drivers, one extra per system it reads. Every one is
# optional and imported inside the function that needs it, because the module's
# main job — PLANNING a load, which is what `complexity --hydration` and
# `python -m data_hydration --dry-run` do — needs none of them. A deployment
# that only reads Oracle must not have to install paramiko to get a plan.
oracle     = ["oracledb>=2.4"]
sftp       = ["paramiko>=3.4"]
# Blob and Data Lake ship together: they share the ranged-read adapter in
# data_hydration.rawio, and a lake path routinely resolves to either endpoint.
adls       = ["azure-storage-file-datalake>=12.14", "azure-storage-blob>=12.19"]
# Reads .sas7bdat without a SAS installation. pandas is explicit: current
# pyreadstat releases no longer install it transitively, while both SAS and
# ordinary file drivers exchange pandas DataFrames with the Delta sink.
sasdata    = ["pyreadstat>=1.2", "pandas>=2.2"]
# A live SAS session. Needed ONLY for SPD Engine libraries, whose component
# files have no open-source reader — see data_hydration/sources/sas_session.py.
saspy      = ["saspy>=5.100"]
# Everything above, for a deployment that hydrates from more than one system.
# Note it does NOT include `spark`: writing the Delta table needs that too, and
# a Databricks cluster already has it.
hydration  = [
    "oracledb>=2.4",
    "paramiko>=3.4",
    "azure-storage-file-datalake>=12.14",
    "azure-storage-blob>=12.19",
    "pyreadstat>=1.2",
    "pandas>=2.2",
    "saspy>=5.100",
]

[tool.setuptools.packages.find]
where = [".", "src"]
# pipeline/engine.py imports chunker, memory.store, llm_client, and
# prompt_builder, so all five packages must ship — a wheel with pipeline
# alone breaks `from pipeline import SasLLMPipeline`. app_config is the
# dependency-free config loader they all read defaults through. complexity
# reads chunker's output and adds no *required* dependency of its own (its
# dependency-graph image is the optional `graph` extra, and degrades to a
# Markdown table without it), so it ships too. Validation also ships: its
# Spark tracking path is optional, while LiveValidator is part of the normal
# conversion pipeline and imports without Spark.
# target_language is the leaf every one of them resolves the run's target
# through, so it ships with all of them. conversion and xref are the SharePoint
# domain layers a real run is driven by, and add no required dependency of
# their own (Graph is the optional `sharepoint` extra; sqlglot is core).
include = [
    "sas_migrate*",
    "pipeline*",
    "chunker*",
    "memory*",
    "llm_client*",
    "prompt_builder*",
    "app_config*",
    "complexity*",
    "conversion*",
    "xref*",
    "target_language*",
    # Markdown -> PDF for both report surfaces. A leaf, like target_language.
    "reporting*",
    # Imports app_config and nothing else in this repo (its chunker types are
    # TYPE_CHECKING-only), and complexity imports it to report the plan — so it
    # ships wherever complexity does. Its drivers are all optional extras.
    "data_hydration*",
    # Shared prompt-cost estimation is imported at module scope by both the
    # LLM client and pipeline. Omitting it makes the installed console script
    # fail before argument parsing even though editable/repo-root runs pass.
    "token_budget*",
    # Inline validation is part of every constructed conversion pipeline,
    # including the installed console script's default workflow.
    "validation*",
]

[tool.setuptools]
# main.py is a top-level *module*, not a package, so packages.find below never
# picks it up — and without it the `sas-parser` console script has nothing to
# import.
py-modules = ["main"]

[tool.setuptools.package-data]
# The assessment rule catalogue moved from complexity/profiles into the v2
# resources tree in Phase 8. Legacy complexity resolves this single packaged
# source until its CLI compatibility surface is removed in Phase 10.
# The configured starter instruction set is runtime input, not documentation.
# Keep the directory structure because its first component scopes rules to a
# target language (pyspark/, sparksql/, or _common/).
prompt_builder = ["instructions/**/*.md"]
# V2 contract schemas and future copied profile/instruction resources.
sas_migrate = ["resources/**/*.json", "resources/**/*.md"]

[tool.coverage.run]
# Bare `--cov` (as CI passes it) measures exactly these packages; without this
# it would measure everything imported, tests included, inflating the total.
branch = true
relative_files = true
source = [
    "pipeline",
    "chunker",
    "memory",
    "llm_client",
    "prompt_builder",
    "app_config",
    "validation",
    "complexity",
    "conversion",
    "xref",
    "reporting",
    "target_language",
    "data_hydration",
    "token_budget",
    "main",
    "sas_migrate",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests over the real reference_docs corpus; skipped when the PDFs are absent",
    "spark_delta: requires the containerized PySpark, JVM, and Delta Lake runtime",
]
filterwarnings = [
    # langgraph-internal deserialisation with the default `allowed_objects`
    # (pending-deprecated by langchain-core >= 1.3.3); no call site in this
    # repo can pass the explicit value. Mirrors the import-time filter in
    # pipeline/engine.py for occurrences at run time under other versions.
    "ignore:.*allowed_objects.*:PendingDeprecationWarning",
]

[tool.pyright]
# Shipped code only. tests/ is deliberately out of the gate (see
# scripts/pyright_ratchet.py); build/ is a gitignored stale wheel tree.
include = [
    "app_config",
    "chunker",
    "complexity",
    "conversion",
    "xref",
    "reporting",
    "pipeline",
    "memory",
    "llm_client",
    "prompt_builder",
    "target_language",
    "validation",
    "data_hydration",
    "token_budget",
    "main.py",
    "src/sas_migrate",
]
exclude = ["**/build/**", "**/.venv/**", "**/__pycache__/**"]
# Resolve the same interpreter and installed packages CI uses (uv's .venv),
# so optional deps (msal, hvac, delta, ...) don't read as missing imports.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
